name: Build

# Every push and pull request: lint, test, and build the Linux packages
# (downloadable from the run's "Artifacts").
# Pushing a tag like v1.0.0 also publishes them as a GitHub release.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # CEF (Chromium) is downloaded once per version into this cached directory
  CEF_PATH: /home/runner/.cache/cef

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libgbm1 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libpango-1.0-0 libcairo2 libasound2t64 libdbus-1-3

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/cef
          key: cef-${{ hashFiles('Cargo.lock') }}
          restore-keys: cef-

      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  package:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libgbm1 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libpango-1.0-0 libcairo2 libasound2t64 libdbus-1-3

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/cef
          key: cef-${{ hashFiles('Cargo.lock') }}
          restore-keys: cef-

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm

      - run: cargo build --release --locked

      - name: Bundle the Chromium runtime
        run: packaging/bundle-cef.sh

      - name: Packages
        run: |
          version=$(cargo pkgid | sed 's/.*[#@]//')
          mkdir -p dist
          cargo deb --no-build --no-strip --output dist/
          cargo generate-rpm --output dist/
          name="tauriwa-${version}-linux-x86_64"
          mkdir -p "$name"
          cp -r target/bundle/tauriwa/. "$name/"
          cp packaging/tauriwa.desktop packaging/tauriwa.svg README.md LICENSE "$name/"
          tar -cJf "dist/$name.tar.xz" "$name"
          cd dist && sha256sum * | tee SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: tauriwa-linux-x86_64
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
