name: Build/release

on:
  push:
    tags:
      - '*'

jobs:
  release:
    permissions:
      contents: write

    runs-on: ubuntu-24.04

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo install --locked cargo-deb cargo-generate-rpm

      - run: cargo build --release --locked

      - name: Packages
        run: |
          mkdir -p dist
          cargo deb --no-build --output dist/
          cargo generate-rpm --output dist/
          name="elecwhat-${GITHUB_REF_NAME}-linux-x86_64"
          mkdir -p "$name"
          cp target/release/elecwhat packaging/elecwhat.desktop static/app-512.png README.md LICENSE "$name/"
          tar -cJf "dist/$name.tar.xz" "$name"

      - name: Print SHA256 digests of built files
        run: find ./dist -maxdepth 1 -type f | sort | xargs sha256sum

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*

      - env:
          BUILDKITE_TOKEN: ${{ secrets.BUILDKITE_TOKEN }}
        run: |
          for f in ./dist/*.deb; do
            curl -s -X POST https://api.buildkite.com/v2/packages/organizations/piec/registries/elecwhat-deb/packages \
              -H "Authorization: Bearer $BUILDKITE_TOKEN" \
              -F "file=@$f"
          done

          for f in ./dist/*.rpm; do
            curl -s -X POST https://api.buildkite.com/v2/packages/organizations/piec/registries/elecwhat-rpm/packages \
              -H "Authorization: Bearer $BUILDKITE_TOKEN" \
              -F "file=@$f"
          done
