name: Build

# Every push and pull request: lint, test, and build the Linux packages
# (downloadable from the run's "Artifacts").
# Pushing a tag like v1.0.0 also publishes them as a GitHub release.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  package:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm

      - run: cargo build --release --locked

      - name: Packages
        run: |
          version=$(cargo pkgid | sed 's/.*[#@]//')
          mkdir -p dist
          cargo deb --no-build --output dist/
          cargo generate-rpm --output dist/
          name="tauriwa-${version}-linux-x86_64"
          mkdir -p "$name"
          cp target/release/tauriwa packaging/tauriwa.desktop static/app-512.png README.md LICENSE "$name/"
          tar -cJf "dist/$name.tar.xz" "$name"
          cd dist && sha256sum * | tee SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: tauriwa-linux-x86_64
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
