[package]
name = "tauriwa"
version = "1.0.0"
edition = "2021"
rust-version = "1.80"
description = "Simple desktop WhatsApp client for linux"
authors = ["aegis-plus", "Pierre Carru <pierre@carru.fr> (original ElecWhat)"]
homepage = "https://github.com/Aegis-plus/TauriWA"
repository = "https://github.com/Aegis-plus/TauriWA"
license = "GPL-3.0-or-later"
readme = "README.md"
publish = false

[dependencies]
# Chromium (CEF): window, browser and message loop
cef = { version = "=156.7.0", default-features = false }
# only to get the path of the downloaded CEF distribution in build.rs (DEP_CEF_DLL_WRAPPER_CEF_DIR)
cef-dll-sys = "=156.7.0"

# tray icon (StatusNotifierItem) and D-Bus
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

image = { version = "0.25", default-features = false, features = ["png", "webp", "ico"] }
ureq = "3"
jsonc-parser = { version = "0.34", features = ["cst", "serde_json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
url = "2"
dirs = "6"
sys-locale = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"

[build-dependencies]
# renders packaging/tauriwa.svg to the PNGs the app embeds (see build.rs)
resvg = { version = "0.45", default-features = false }

# `cargo deb`
# `packaging/bundle-cef.sh` then `cargo deb --no-build`
[package.metadata.deb]
section = "net"
depends = "$auto, xdg-utils"
extended-description = "Simple and stable desktop WhatsApp Web client for Linux, running WhatsApp Web in Chromium (CEF): tray icon with unread count, notifications, keyboard shortcuts, custom CSS and user scripts, D-Bus interface."
assets = [
  ["packaging/tauriwa.sh", "usr/bin/tauriwa", "755"],
  ["target/bundle/tauriwa/tauriwa", "usr/lib/tauriwa/", "755"],
  ["target/bundle/tauriwa/*.so", "usr/lib/tauriwa/", "644"],
  ["target/bundle/tauriwa/*.so.1", "usr/lib/tauriwa/", "644"],
  ["target/bundle/tauriwa/*.pak", "usr/lib/tauriwa/", "644"],
  ["target/bundle/tauriwa/*.dat", "usr/lib/tauriwa/", "644"],
  ["target/bundle/tauriwa/*.bin", "usr/lib/tauriwa/", "644"],
  ["target/bundle/tauriwa/*.json", "usr/lib/tauriwa/", "644"],
  ["target/bundle/tauriwa/locales/*", "usr/lib/tauriwa/locales/", "644"],
  ["packaging/tauriwa.desktop", "usr/share/applications/", "644"],
  ["packaging/tauriwa.svg", "usr/share/icons/hicolor/scalable/apps/tauriwa.svg", "644"],
  ["packaging/io.github.aegis_plus.tauriwa.metainfo.xml", "usr/share/metainfo/", "644"],
]

# `packaging/bundle-cef.sh` then `cargo generate-rpm`
[package.metadata.generate-rpm]
auto-req = "builtin"
assets = [
  { source = "packaging/tauriwa.sh", dest = "/usr/bin/tauriwa", mode = "755" },
  { source = "target/bundle/tauriwa/tauriwa", dest = "/usr/lib/tauriwa/tauriwa", mode = "755" },
  { source = "target/bundle/tauriwa/*.so", dest = "/usr/lib/tauriwa/", mode = "644" },
  { source = "target/bundle/tauriwa/*.so.1", dest = "/usr/lib/tauriwa/", mode = "644" },
  { source = "target/bundle/tauriwa/*.pak", dest = "/usr/lib/tauriwa/", mode = "644" },
  { source = "target/bundle/tauriwa/*.dat", dest = "/usr/lib/tauriwa/", mode = "644" },
  { source = "target/bundle/tauriwa/*.bin", dest = "/usr/lib/tauriwa/", mode = "644" },
  { source = "target/bundle/tauriwa/*.json", dest = "/usr/lib/tauriwa/", mode = "644" },
  { source = "target/bundle/tauriwa/locales/*", dest = "/usr/lib/tauriwa/locales/", mode = "644" },
  { source = "packaging/tauriwa.desktop", dest = "/usr/share/applications/tauriwa.desktop", mode = "644" },
  { source = "packaging/tauriwa.svg", dest = "/usr/share/icons/hicolor/scalable/apps/tauriwa.svg", mode = "644" },
  { source = "packaging/io.github.aegis_plus.tauriwa.metainfo.xml", dest = "/usr/share/metainfo/io.github.aegis_plus.tauriwa.metainfo.xml", mode = "644" },
]
[package.metadata.generate-rpm.requires]
xdg-utils = "*"
