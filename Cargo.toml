[package]
name = "tauriwa"
version = "1.0.0"
edition = "2021"
rust-version = "1.80"
description = "Simple desktop WhatsApp client for linux"
authors = ["aegis-plus", "Pierre Carru <pierre@carru.fr> (original ElecWhat)"]
homepage = "https://github.com/Aegis-plus/TauriWA"
repository = "https://github.com/Aegis-plus/TauriWA"
license = "GPL-3.0-or-later"
readme = "README.md"
publish = false

[dependencies]
# window + event loop (GTK on Linux) and the WebKitGTK webview
tao = "0.37"
wry = { version = "0.57", default-features = false, features = ["os-webview", "x11", "devtools"] }
# direct access to the webkit/gtk objects wry builds on (versions must match wry's)
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }
gtk = "0.18"
glib = "0.18"

# tray icon (StatusNotifierItem) and D-Bus
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

image = { version = "0.25", default-features = false, features = ["png", "webp", "ico"] }
ureq = "3"
jsonc-parser = { version = "0.34", features = ["cst", "serde_json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
url = "2"
dirs = "6"
sys-locale = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"

# `cargo deb`
[package.metadata.deb]
section = "net"
depends = "$auto"
extended-description = "Simple and stable desktop WhatsApp Web client for Linux: tray icon with unread count, notifications, keyboard shortcuts, custom CSS and user scripts, D-Bus interface."
assets = [
  ["target/release/tauriwa", "usr/bin/", "755"],
  ["packaging/tauriwa.desktop", "usr/share/applications/", "644"],
  ["static/app-512.png", "usr/share/icons/hicolor/512x512/apps/tauriwa.png", "644"],
  ["packaging/io.github.aegis_plus.tauriwa.metainfo.xml", "usr/share/metainfo/", "644"],
]

# `cargo generate-rpm`
[package.metadata.generate-rpm]
assets = [
  { source = "target/release/tauriwa", dest = "/usr/bin/tauriwa", mode = "755" },
  { source = "packaging/tauriwa.desktop", dest = "/usr/share/applications/tauriwa.desktop", mode = "644" },
  { source = "static/app-512.png", dest = "/usr/share/icons/hicolor/512x512/apps/tauriwa.png", mode = "644" },
  { source = "packaging/io.github.aegis_plus.tauriwa.metainfo.xml", dest = "/usr/share/metainfo/io.github.aegis_plus.tauriwa.metainfo.xml", mode = "644" },
]
[package.metadata.generate-rpm.requires]
webkit2gtk4.1 = "*"
gtk3 = "*"
